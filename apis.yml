aid: esper-satellite-imagery
name: Esper Satellite Imagery
description: >-
  Esper Satellite Imagery is an Australian space-technology company building an
  18-satellite hyperspectral Earth-observation constellation (the Over The
  Rainbow / OTR program) to deliver global chemical-composition data of the
  planet's surface from orbit. Its Esperesso hyperspectral imagers capture more
  than 100 contiguous spectral bands spanning roughly 400 to 1000 nm, which
  Esper turns into mineralisation maps that identify lithium, rare earths, gold,
  nickel, cobalt and alteration zones for critical-mineral exploration — faster,
  cheaper and greener than traditional ground surveys. Founded in 2021 in
  Melbourne, Victoria by Iqbal and Joey Lorenczak, Esper sells custom
  area-of-interest mineral maps and a pre-built Northern Territory mineral map.
  It does not currently publish a public developer API; this profile captures
  the company's public web, security and code-repository surface.
